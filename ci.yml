name: C++ tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile tests
        run: g++ -std=c++17 -Wall -Wextra -pedantic -I. tests/Tic_Tac_Two_tests_for_main.cpp -o game_tests
      - name: Run tests
        run: ./game_tests
